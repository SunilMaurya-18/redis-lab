services:
  redis-node-7000:
    image: redis:8
    container_name: redis-lab-node-7000
    ports: ["7000:7000", "17000:17000"]
    command: ["redis-server", "--port", "7000", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--cluster-announce-hostname", "redis-node-7000", "--cluster-preferred-endpoint-type", "hostname"]
    volumes: ["redis_cluster_7000:/data"]

  redis-node-7001:
    image: redis:8
    container_name: redis-lab-node-7001
    ports: ["7001:7001", "17001:17001"]
    command: ["redis-server", "--port", "7001", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--cluster-announce-hostname", "redis-node-7001", "--cluster-preferred-endpoint-type", "hostname"]
    volumes: ["redis_cluster_7001:/data"]

  redis-node-7002:
    image: redis:8
    container_name: redis-lab-node-7002
    ports: ["7002:7002", "17002:17002"]
    command: ["redis-server", "--port", "7002", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--cluster-announce-hostname", "redis-node-7002", "--cluster-preferred-endpoint-type", "hostname"]
    volumes: ["redis_cluster_7002:/data"]

  redis-node-7003:
    image: redis:8
    container_name: redis-lab-node-7003
    ports: ["7003:7003", "17003:17003"]
    command: ["redis-server", "--port", "7003", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--cluster-announce-hostname", "redis-node-7003", "--cluster-preferred-endpoint-type", "hostname"]
    volumes: ["redis_cluster_7003:/data"]

  redis-node-7004:
    image: redis:8
    container_name: redis-lab-node-7004
    ports: ["7004:7004", "17004:17004"]
    command: ["redis-server", "--port", "7004", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--cluster-announce-hostname", "redis-node-7004", "--cluster-preferred-endpoint-type", "hostname"]
    volumes: ["redis_cluster_7004:/data"]

  redis-node-7005:
    image: redis:8
    container_name: redis-lab-node-7005
    ports: ["7005:7005", "17005:17005"]
    command: ["redis-server", "--port", "7005", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--cluster-announce-hostname", "redis-node-7005", "--cluster-preferred-endpoint-type", "hostname"]
    volumes: ["redis_cluster_7005:/data"]

  cluster-init:
    image: redis:8
    container_name: redis-lab-cluster-init
    depends_on:
      - redis-node-7000
      - redis-node-7001
      - redis-node-7002
      - redis-node-7003
      - redis-node-7004
      - redis-node-7005
    command: ["sh", "-c", "sleep 5 && redis-cli --cluster create redis-node-7000:7000 redis-node-7001:7001 redis-node-7002:7002 redis-node-7003:7003 redis-node-7004:7004 redis-node-7005:7005 --cluster-replicas 1 --cluster-yes"]
    restart: "no"

volumes:
  redis_cluster_7000:
  redis_cluster_7001:
  redis_cluster_7002:
  redis_cluster_7003:
  redis_cluster_7004:
  redis_cluster_7005:
